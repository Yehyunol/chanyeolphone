<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111">
<title>Chanyeol Phone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:#111;color:#fff}
button{font:inherit}
.phone{position:relative;width:100vw;height:100vh;overflow:hidden;background:#111}
.screen{position:absolute;inset:0;background-size:cover;background-position:center;transition:background-image .35s ease}
.screen:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.08) 45%,rgba(0,0,0,.28));pointer-events:none}
.status{position:absolute;z-index:20;top:0;left:0;right:0;height:38px;padding:10px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:650;text-shadow:0 1px 5px #000}
.status-right{display:flex;gap:8px;align-items:center}
.signal{letter-spacing:-2px}.battery{width:23px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;border-radius:1px;background:#fff}.battery i{display:block;width:80%;height:100%;background:#fff;border-radius:1px}
.lock{z-index:10;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:82px;touch-action:none}
.lock .small{font-size:16px;font-weight:500;text-shadow:0 2px 10px #000}
.lock .time{font-size:78px;line-height:.95;font-weight:300;letter-spacing:-4px;margin-top:7px;text-shadow:0 2px 16px #000}
.lock .date{font-size:17px;margin-top:12px;font-weight:500;text-shadow:0 2px 10px #000}
.lock-bottom{position:absolute;bottom:30px;left:0;right:0;text-align:center}
.unlock-pill{display:inline-flex;align-items:center;gap:9px;color:#fff;font-size:14px;font-weight:500;background:rgba(255,255,255,.16);backdrop-filter:blur(18px);padding:10px 18px;border:1px solid rgba(255,255,255,.22);border-radius:999px;box-shadow:0 8px 25px rgba(0,0,0,.18)}
.arrow{font-size:17px;animation:bounce 1.3s infinite}
@keyframes bounce{50%{transform:translateY(-4px)}}
.home{z-index:5;position:absolute;inset:0;padding:62px 18px 92px;opacity:0;pointer-events:none;transform:scale(1.03);transition:.38s cubic-bezier(.22,.8,.25,1)}
.home.active{opacity:1;pointer-events:auto;transform:scale(1)}
.widget{width:100%;padding:18px 18px 16px;border-radius:27px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,.14)}
.widget-top{display:flex;justify-content:space-between;align-items:flex-start}.widget-time{font-size:36px;line-height:1;font-weight:650;letter-spacing:-1px}.widget-sub{font-size:12px;margin-top:7px;opacity:.85}.weather{text-align:right}.weather b{display:block;font-size:25px}.weather span{font-size:12px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;margin-top:28px}
.app-icon{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;cursor:pointer}
.icon{width:59px;height:59px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.9);box-shadow:0 8px 20px rgba(0,0,0,.18);color:#222}
.icon.kakao{background:#fee500}.icon.ins{background:linear-gradient(135deg,#ffd600,#ff0069,#7b2cff);font-size:27px}.icon.photos{background:rgba(255,255,255,.93)}.icon.notes{background:#fff;color:#222}.icon.music{background:#222;color:#fff}.icon.settings{background:#dfe2e7}
.app-icon span{font-size:11px;font-weight:500;text-shadow:0 2px 7px #000}
.dock{position:absolute;z-index:8;left:14px;right:14px;bottom:15px;height:74px;border-radius:27px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(25px);display:flex;justify-content:space-around;align-items:center}
.dock .icon{width:52px;height:52px;border-radius:15px}
.appview{z-index:15;position:absolute;inset:0;background:#f7f7f9;color:#111;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column}
.appview.open{transform:translateY(0)}
.appbar{height:72px;padding:18px 18px 8px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #ddd;background:rgba(250,250,252,.9);backdrop-filter:blur(18px);flex-shrink:0}
.app-title{font-size:24px;font-weight:750}.close{border:0;background:#e7e7ec;border-radius:50%;width:31px;height:31px;color:#333;font-size:18px}
.appbody{flex:1;overflow:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px rgba(0,0,0,.05)}
.chat{display:flex;gap:10px;margin-bottom:16px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eee;font-size:21px;flex:none}.bubble{background:#e9e9ee;border-radius:4px 17px 17px 17px;padding:10px 13px;max-width:75%;font-size:14px;line-height:1.5}.mine{justify-content:flex-end}.mine .bubble{background:#fee500;border-radius:17px 4px 17px 17px}
.insta-post{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.06)}.post-head{padding:12px;display:flex;align-items:center;gap:9px;font-weight:650}.post-img{height:260px;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,#ffc6d9,#b8d8ff,#f8e6b5)}.post-caption{padding:12px;font-size:14px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.photo{aspect-ratio:1;background:linear-gradient(135deg,#ffd4e5,#b8dcff);display:grid;place-items:center;font-size:34px}.photo:nth-child(2){background:linear-gradient(135deg,#ffe9b8,#ffc3c3)}.photo:nth-child(3){background:linear-gradient(135deg,#c8f2d5,#c4d8ff)}
.note{padding:15px;border-radius:16px;background:#fff5a8;margin-bottom:12px}.note h3{margin:0 0 7px}.note p{margin:0;font-size:14px;line-height:1.5}
.setting{background:#fff;border-radius:15px;padding:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.setting small{display:block;color:#777;margin-top:3px}.toggle{width:45px;height:26px;border-radius:20px;background:#22c55e;padding:3px}.toggle i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;margin-left:auto}
.homebar{position:absolute;z-index:30;bottom:7px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:5px;background:#111;opacity:.8;cursor:pointer}
.appview .homebar{background:#111}
.tip{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.4);padding:7px 12px;border-radius:999px;opacity:.9;white-space:nowrap}
@media (min-width:700px){
 .phone{width:390px;height:844px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:45px;box-shadow:0 30px 80px rgba(0,0,0,.45);border:7px solid #181818}
 .status{border-radius:38px 38px 0 0}.screen,.appview{border-radius:38px}
}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="screen" id="screen">
    <div class="status">
      <span id="statusTime">9:41</span>
      <div class="status-right"><span class="signal">▮▮▮</span><span>Wi‑Fi</span><span class="battery"><i></i></span></div>
    </div>

    <section class="lock" id="lock">
      <div class="small">CHANYEOL PHONE</div>
      <div class="time" id="lockTime">9:41</div>
      <div class="date" id="lockDate">11月24日 星期二</div>
      <div class="lock-bottom">
        <div class="unlock-pill"><span class="arrow">↑</span> 向上滑动解锁</div>
      </div>
    </section>

    <section class="home" id="home">
      <div class="widget">
        <div class="widget-top">
          <div><div class="widget-time" id="homeTime">9:41</div><div class="widget-sub" id="homeDate">11月24日 星期二</div></div>
          <div class="weather"><b>☀️ 18°</b><span>杨浦区 · 晴朗</span></div>
        </div>
      </div>

      <div class="grid">
        <button class="app-icon" onclick="openApp('kakao')"><div class="icon kakao">💬</div><span>KakaoTalk</span></button>
        <button class="app-icon" onclick="openApp('instagram')"><div class="icon ins">◎</div><span>Instagram</span></button>
        <button class="app-icon" onclick="openApp('photos')"><div class="icon photos">🌈</div><span>Photos</span></button>
        <button class="app-icon" onclick="openApp('notes')"><div class="icon notes">📝</div><span>Notes</span></button>
        <button class="app-icon" onclick="openApp('music')"><div class="icon music">♪</div><span>Music</span></button>
        <button class="app-icon" onclick="openApp('settings')"><div class="icon settings">⚙️</div><span>Settings</span></button>
      </div>

      <div class="tip">点击 App 图标开始探索</div>
      <div class="dock">
        <button class="app-icon" onclick="openApp('kakao')"><div class="icon kakao">💬</div></button>
        <button class="app-icon" onclick="openApp('instagram')"><div class="icon ins">◎</div></button>
        <button class="app-icon" onclick="openApp('photos')"><div class="icon photos">🌈</div></button>
        <button class="app-icon" onclick="openApp('settings')"><div class="icon settings">⚙️</div></button>
      </div>
    </section>

    <section class="appview" id="appview">
      <div class="appbar"><div class="app-title" id="appTitle">App</div><button class="close" onclick="closeApp()">×</button></div>
      <div class="appbody" id="appbody"></div>
      <div class="homebar" onclick="closeApp()"></div>
    </section>

    <div class="homebar" id="lockHome" style="background:#fff;bottom:8px"></div>
  </div>
</div>

<script>
const wallpapers=[
 'linear-gradient(135deg,#f5c6d6 0%,#c9d8ff 48%,#f8e7b2 100%)',
 'linear-gradient(145deg,#b8d8ff,#e7c7ff 45%,#ffd3dc)',
 'linear-gradient(135deg,#c7f0d8,#b7d8ff 50%,#f9d2a7)'
];
let unlocked=false, startY=0;
const $=id=>document.getElementById(id);
function setWallpaper(i=0){$('screen').style.backgroundImage=wallpapers[i%wallpapers.length]}
setWallpaper(0);

function updateTime(){
 const d=new Date(), t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
 const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
 const date=`${d.getMonth()+1}月${d.getDate()}日 ${days[d.getDay()]}`;
 $('statusTime').textContent=t;$('lockTime').textContent=t;$('homeTime').textContent=t;$('lockDate').textContent=date;$('homeDate').textContent=date;
}
updateTime();setInterval(updateTime,1000);

function unlock(){
 if(unlocked)return;
 unlocked=true;$('lock').style.transform='translateY(-105%)';$('lock').style.opacity='0';$('home').classList.add('active');$('lockHome').style.display='none';
}
$('lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});
$('lock').addEventListener('touchmove',e=>{if(startY-e.touches[0].clientY>55)unlock()},{passive:true});
$('lock').addEventListener('mousedown',e=>startY=e.clientY);
$('lock').addEventListener('mousemove',e=>{if(e.buttons&&startY-e.clientY>55)unlock()});

const data={
 kakao:{title:'KakaoTalk',html:`
   <div class="card"><b>Chats</b></div>
   <div class="chat"><div class="avatar">🌙</div><div class="bubble">今天也要好好吃饭。<br>下午一起去散步吗？</div></div>
   <div class="chat mine"><div class="bubble">好呀！我刚好想出去走走。</div></div>
   <div class="chat"><div class="avatar">☁️</div><div class="bubble">那就晚上见啦 :)</div></div>
 `},
 instagram:{title:'Instagram',html:`
   <div class="insta-post"><div class="post-head"><div class="avatar">🐰</div>chanyeol_phone</div><div class="post-img">🌅</div><div class="post-caption">A quiet afternoon. ✨<br><br>♡ 128 &nbsp; 💬 14</div></div>
   <div class="insta-post"><div class="post-head"><div class="avatar">🌿</div>daily_archive</div><div class="post-img">☕</div><div class="post-caption">Somewhere between coffee and sunset.</div></div>
 `},
 photos:{title:'Photos',html:`
   <div class="card"><b>Recents</b><p style="color:#777;font-size:13px">6 photos · 示例相册</p></div>
   <div class="photo-grid"><div class="photo">🌅</div><div class="photo">☕</div><div class="photo">🌿</div><div class="photo">🌙</div><div class="photo">🎧</div><div class="photo">🌸</div></div>
 `},
 notes:{title:'Notes',html:`
   <div class="note"><h3>Today</h3><p>Remember to take a break.<br>晚上整理照片和音乐歌单。</p></div>
   <div class="note"><h3>Chanyeol Phone</h3><p>第一阶段：锁屏、桌面、App 导航完成。</p></div>
   <div class="note"><h3>Ideas</h3><p>以后加入角色聊天、动态、通知中心和主题商店。</p></div>
 `},
 music:{title:'Music',html:`
   <div class="card" style="text-align:center;padding:28px"><div style="font-size:70px">🎧</div><h2 style="margin:12px 0 4px">Night Walk</h2><p style="color:#777;margin:0">Chanyeol Phone Demo Playlist</p><button style="margin-top:22px;border:0;border-radius:50%;width:54px;height:54px;background:#111;color:#fff;font-size:20px" onclick="alert('示例播放器：这里以后可以接入真实音频。')">▶</button></div>
 `},
 settings:{title:'Settings',html:`
   <div class="card"><b>Appearance</b></div>
   <div class="setting" onclick="nextWallpaper()"><div>Wallpaper<small>点击切换示例壁纸</small></div><span>›</span></div>
   <div class="setting"><div>Notifications<small>Allow notifications</small></div><div class="toggle"><i></i></div></div>
   <div class="setting"><div>About<small>Chanyeol Phone · Demo 1.0</small></div><span>›</span></div>
 `}}
let wallpaperIndex=0;
function nextWallpaper(){wallpaperIndex=(wallpaperIndex+1)%wallpapers.length;setWallpaper(wallpaperIndex)}
function openApp(name){
 $('appTitle').textContent=data[name].title;$('appbody').innerHTML=data[name].html;$('appview').classList.add('open');
}
function closeApp(){$('appview').classList.remove('open')}
$('lockHome').addEventListener('click',unlock);
</script>
</body>
</html>
